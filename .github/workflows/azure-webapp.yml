name: Deploy Flask app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build deployment bundle
        run: |
          DEPLOY_DIR="$GITHUB_WORKSPACE/deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '.python_packages/' \
            --exclude '.vscode/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.pyd' \
            --exclude '*.log' \
            --exclude 'debug_output*.txt' \
            --exclude 'dump_output*.txt' \
            --exclude 'app_startup*.txt' \
            --exclude 'data_backup/' \
            --exclude 'models_backup/' \
            --exclude 'logs/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude '*.zip' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            ./ "$DEPLOY_DIR/"
          python -m pip install --upgrade pip
          python -m pip install --target "$DEPLOY_DIR/.python_packages/lib/site-packages" -r requirements.txt

      - name: Smoke test app import
        env:
          PYTHONPATH: ${{ github.workspace }}/deploy/.python_packages/lib/site-packages:${{ github.workspace }}/deploy
        run: python -c "import app; print('APP_IMPORT_OK')"

      - name: Validate core app files
        run: python -m compileall app.py database.py

      - name: Ensure Azure credentials are available
        id: cred-check
        run: |
          if [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "publish-profile=present" >> $GITHUB_OUTPUT
          else
            echo "publish-profile=missing" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "sp=present" >> $GITHUB_OUTPUT
          else
            echo "sp=missing" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login (service principal)
        if: steps.cred-check.outputs.sp == 'present'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (publish profile)
        if: steps.cred-check.outputs.publish-profile == 'present'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy

      - name: Fail if no Azure credentials found
        if: steps.cred-check.outputs.publish-profile == 'missing' && steps.cred-check.outputs.sp == 'missing'
        run: |
          echo "\nERROR: No Azure deployment credentials found. Add one of the following secrets to this repository:\n  - AZURE_WEBAPP_PUBLISH_PROFILE (publish profile XML) OR\n  - AZURE_CREDENTIALS (service principal JSON)\nFollow the README or https://github.com/azure/login for details.\n" >&2
          exit 1
