name: Deploy Flask app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build deployment bundle
        run: |
          DEPLOY_DIR="$GITHUB_WORKSPACE/deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '.python_packages/' \
            --exclude '.vscode/' \
            --exclude '__pycache__/' \
            --exclude '*/__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.pyd' \
            --exclude '*.log' \
            --exclude 'debug_output*.txt' \
            --exclude 'dump_output*.txt' \
            --exclude 'app_startup*.txt' \
            --exclude 'data_backup/' \
            --exclude 'models_backup/' \
            --exclude 'ml_modules/document_forgery/doc_data/' \
            --exclude 'test_documents/' \
            --exclude 'logs/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude 'check_*.py' \
            --exclude 'debug_*.py' \
            --exclude 'fix_*.py' \
            --exclude 'test_*.py' \
            --exclude 'verify_*.py' \
            --exclude 'demonstrate_*.py' \
            --exclude 'create_test_*.py' \
            --exclude 'trigger_*.py' \
            --exclude 'view_*.py' \
            --exclude '*/train.py' \
            --exclude '*/train_*.py' \
            --exclude '*/generate_data.py' \
            --exclude '*/quick_demo.py' \
            --exclude '*.md' \
            --exclude '*.csv' \
            --exclude '*.npy' \
            --exclude '*.log' \
            --exclude '*.zip' \
            --exclude '*.tar.gz' \
            --exclude '*.7z' \
            ./ "$DEPLOY_DIR/"
          du -sh "$DEPLOY_DIR"
          test "$(du -sm "$DEPLOY_DIR" | cut -f1)" -lt 250

      - name: Install dependencies for smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test app import
        env:
          PYTHONPATH: ${{ github.workspace }}/deploy
        run: python -c "import app; print('APP_IMPORT_OK')"

      - name: Validate core app files
        run: python -m compileall app.py database.py

      - name: Wait for Azure SCM to settle
        run: sleep 30

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy
