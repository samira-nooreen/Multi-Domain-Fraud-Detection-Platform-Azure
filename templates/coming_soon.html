<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ module_name }} - Coming Soon</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f8fa;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(20, 20, 20, 0.08);
        max-width: 720px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 28px;
      }
      p {
        color: #555;
      }
      .note {
        margin-top: 16px;
        font-size: 13px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>{{ module_name }}</h1>
      <p>
        This module is coming soon. We're working on integrating it into the
        platform.
      </p>
      <p class="note">
        If you need this functionality sooner, let us know which features you
        require.
      </p>
    </div>
  </body>
</html>
